<!doctype html>
<html lang="en" data-composition-variables='[{"id":"repo","type":"string","label":"Repo URL","default":"github.com/kartikmehta8/beam"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0b0d;
        --surface: #111317;
        --surface-2: #171a1f;
        --muted: #1b1f25;
        --ink: #f5f7fa;
        --ink-2: #b9c6d2;
        --ink-3: #7d8c99;
        --line: rgba(255, 255, 255, 0.10);
        --accent: #0080bc;
        --accent-2: #38a7dd;
        --ok: #28c840;
        --warn: #febc2e;
        --danger: #ff5f57;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
      }
      #root { width: 100%; height: 100%; position: relative; }
      #bg { position: absolute; inset: 0; background: var(--ground); z-index: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="186"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div id="s1-title" data-composition-id="s1-title" data-composition-src="compositions/s1-title.html"
        data-track-kind="graphics" data-track-index="1"
        data-start="0" data-duration="12" data-width="1920" data-height="1080"></div>
      <div id="s2-floating" data-composition-id="s2-floating" data-composition-src="compositions/s2-floating.html"
        data-track-kind="graphics" data-track-index="1"
        data-start="12" data-duration="46" data-width="1920" data-height="1080"></div>
      <div id="s3-agent" data-composition-id="s3-agent" data-composition-src="compositions/s3-agent.html"
        data-track-kind="graphics" data-track-index="1"
        data-start="58" data-duration="54" data-width="1920" data-height="1080"></div>
      <div id="s4-features" data-composition-id="s4-features" data-composition-src="compositions/s4-features.html"
        data-track-kind="graphics" data-track-index="1"
        data-start="112" data-duration="56" data-width="1920" data-height="1080"></div>
      <div id="s5-end" data-composition-id="s5-end" data-composition-src="compositions/s5-end.html"
        data-track-kind="graphics" data-track-index="1"
        data-start="168" data-duration="18" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
