<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 400;
        src: url("file:///Users/kartikmehta/Desktop/beam/website/public/assets/inter-regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 500;
        src: url("file:///Users/kartikmehta/Desktop/beam/website/public/assets/inter-medium.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 600;
        src: url("file:///Users/kartikmehta/Desktop/beam/website/public/assets/inter-semibold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Mono";
        font-weight: 400;
        src: url("file:///Users/kartikmehta/Desktop/beam/website/public/assets/roboto-mono.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(1100px 700px at 82% -10%, rgba(0, 128, 188, 0.22), transparent 60%),
          radial-gradient(900px 600px at 0% 120%, rgba(0, 128, 188, 0.10), transparent 55%),
          #0a0b0d;
        color: #f5f7fa;
        padding: 72px 76px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(900px 600px at 70% 10%, #000 0%, transparent 75%);
      }
      .brand { display: flex; align-items: center; gap: 20px; position: relative; }
      .mark {
        width: 76px; height: 76px; border-radius: 20px; background: #0080BC;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 40px rgba(0, 128, 188, 0.45);
      }
      .mark svg { width: 48px; height: 48px; }
      .word { font-size: 46px; font-weight: 600; letter-spacing: -0.02em; }
      .pill {
        margin-left: 10px; font-size: 20px; font-weight: 500; color: #9fb4c4;
        border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 8px 18px;
      }
      h1 {
        position: relative;
        font-size: 104px; line-height: 0.98; font-weight: 600; letter-spacing: -0.035em;
      }
      h1 span { color: #38a7dd; }
      .sub { position: relative; font-size: 30px; font-weight: 400; color: #b9c6d2; margin-top: 26px; max-width: 900px; }
      .foot { display: flex; align-items: center; justify-content: space-between; position: relative; }
      .caps { display: flex; gap: 14px; flex-wrap: wrap; }
      .cap {
        font-size: 22px; font-weight: 500; color: #dfe8ef;
        border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.03);
        border-radius: 999px; padding: 10px 20px; display: flex; align-items: center; gap: 10px;
      }
      .cap b { color: #38a7dd; font-weight: 600; }
      .tag { font-family: "Mono"; font-size: 19px; color: #7d8c99; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><path fill="#fff" fill-rule="evenodd" d="M20.894 8.662A9.5 9.5 0 1 1 15.338 3.106A4 4 0 0 0 13.618 5.911A6.3 6.3 0 1 0 18.089 10.382A4 4 0 0 0 20.894 8.662ZM20.186 6.414A2.6 2.6 0 1 1 14.986 6.414A2.6 2.6 0 1 1 20.186 6.414Z"/></svg></span>
      <span class="word">beam</span>
      <span class="pill">Android wallet</span>
    </div>
    <div>
      <h1>Your screen.<br />Your wallet.<br /><span>Your call.</span></h1>
      <p class="sub">Pay from the screen you're on. A floating wallet, AI agents you approve, and safety checks before you send.</p>
    </div>
    <div class="foot">
      <div class="caps">
        <span class="cap"><b>ENS</b> names</span>
        <span class="cap"><b>World ID</b> approvals</span>
        <span class="cap"><b>USDC</b> on Arc</span>
        <span class="cap"><b>MCP</b> agents</span>
      </div>
      <span class="tag">ETHGlobal Mumbai</span>
    </div>
  </body>
</html>
